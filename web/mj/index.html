<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13100c">
<title>Table du MJ</title>
<link rel="icon" type="image/svg+xml" href="/commun/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/commun/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo"><i class="ico" style="--i:url(/commun/icones/lanterne.svg)"></i></span><div><div>Table du MJ</div><div id="camp-name" class="camp-name" title="Campagne active"></div></div></div>
  <nav id="tabs">
    <button data-tab="campagnes" title="Campagnes"><i class="ico" style="--i:url(/commun/icones/campagnes.svg)"></i><span>Campagnes</span></button>
    <button data-tab="persos" title="Personnages"><i class="ico" style="--i:url(/commun/icones/persos.svg)"></i><span>Personnages</span></button>
    <button data-tab="combat" title="Combat"><i class="ico" style="--i:url(/commun/icones/combat.svg)"></i><span>Combat</span></button>
    <button data-tab="carte" title="Carte"><i class="ico" style="--i:url(/commun/icones/carte.svg)"></i><span>Carte</span></button>
    <button data-tab="grimoire" title="Grimoire"><i class="ico" style="--i:url(/commun/icones/grimoire.svg)"></i><span>Grimoire</span></button>
    <button data-tab="bestiaire" title="Bestiaire"><i class="ico" style="--i:url(/commun/icones/bestiaire.svg)"></i><span>Bestiaire</span></button>
    <button data-tab="journal" title="Journal"><i class="ico" style="--i:url(/commun/icones/journal.svg)"></i><span>Journal</span></button>
    <button data-tab="outils" title="Outils"><i class="ico" style="--i:url(/commun/icones/outils.svg)"></i><span>Outils</span></button>
  </nav>
  <div class="top-right">
    <span id="savestate" title="État de la sauvegarde">✔ enregistré</span>
    <button class="small hbtn" id="theme-btn" title="Apparence / thèmes"><i class="ico i-palette"></i> Thème</button>
    <a href="/joueurs" target="_blank" class="btn small" title="Ouvrir la vue à montrer aux joueurs (2e écran)"><i class="ico i-oeil"></i> Vue joueurs</a>
  </div>
</header>
<div id="layout">
  <main id="main"></main>
  <aside id="dice">
    <div class="dice-head">
      <h3><i class="ico" style="--i:url(/commun/icones/des.svg)"></i> Dés</h3>
      <label class="chk" title="Le jet n'apparaît pas sur la vue joueurs"><input type="checkbox" id="d-secret"> secret</label>
    </div>
    <div class="dice-btns">
      <button data-die="4">d4</button><button data-die="6">d6</button><button data-die="8">d8</button>
      <button data-die="10">d10</button><button data-die="12">d12</button><button data-die="20" class="d20">d20</button>
      <button data-die="100">d100</button>
    </div>
    <div class="adv-row">
      <label><input type="radio" name="adv" value="0" checked> normal</label>
      <label><input type="radio" name="adv" value="1"> avantage</label>
      <label><input type="radio" name="adv" value="-1"> désavantage</label>
    </div>
    <form id="d-form" class="row">
      <input id="d-expr" placeholder="ex : 2d6+3, 4d6kh3, d20+5" autocomplete="off">
      <button class="primary">Lancer</button>
    </form>
    <div class="row group-roll">
      <select id="g-skill" title="Jet de groupe : tous les PJ lancent"></select>
      <button id="g-roll" title="Tous les personnages lancent ce jet">Jet de groupe</button>
    </div>
    <div id="d-last"></div>
    <div class="log-head"><span>Historique <span class="muted small">(<i class="ico i-joueur"></i> = jet d'un joueur)</span></span><button class="link" id="d-clear">vider</button></div>
    <div id="d-log"></div>
  </aside>
</div>
<div id="modal" class="hidden"><div class="modal-box"></div></div>
<div id="toasts"></div>
<script src="/commun/core.js"></script>
<script src="/commun/sorts.js"></script>
<script src="/commun/mapview.js"></script>
<script src="/commun/classes.js"></script>
<script src="/commun/niveaux.js"></script>
<script src="/mj/persos.js"></script>
<script src="/mj/combat.js"></script>
<script src="/mj/carte.js"></script>
<script src="/mj/grimoire.js"></script>
<script src="/mj/bestiaire.js"></script>
<script src="/mj/outils.js"></script>
<script src="/mj/campagnes.js"></script>
<script>
  document.getElementById('theme-btn').onclick = themeModal;
  boot();
</script>
</body>
</html>
