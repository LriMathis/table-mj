<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<title>Table — Joueurs</title>
<link rel="icon" type="image/svg+xml" href="/commun/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/commun/style.css">
<link rel="stylesheet" href="/joueurs/joueurs.css">
</head>
<body class="player">
<div id="stage">
  <div id="pv" class="map-vp"></div>
  <div id="topbar">
    <div id="camp-title"></div>
    <div id="round" class="hidden"></div>
    <div id="ini"></div>
  </div>
  <div id="turn" class="hidden"><i class="ico i-combat"></i> C'est votre tour !</div>
  <div id="feed"></div>
  <div id="hud"><button id="h-me" title="Me trouver"><i class="ico i-cible"></i></button><button id="h-in">＋</button><button id="h-out">－</button><button id="h-fit" title="Voir toute la carte">⤢</button><button id="h-full" title="Plein écran">⛶</button><button id="h-theme" title="Apparence"><i class="ico i-palette"></i></button><button id="h-panel" title="Afficher / masquer le panneau">☰</button></div>
</div>
<aside id="panel">
  <div id="me-head"></div>
  <nav id="ptabs">
    <button data-pt="fiche"><i class="ico" style="--i:url(/commun/icones/fiche.svg)"></i><span>Fiche</span></button>
    <button data-pt="actions"><i class="ico" style="--i:url(/commun/icones/actions.svg)"></i><span>Actions</span></button>
    <button data-pt="sorts"><i class="ico" style="--i:url(/commun/icones/sorts.svg)"></i><span>Sorts</span></button>
    <button data-pt="des"><i class="ico" style="--i:url(/commun/icones/des.svg)"></i><span>Dés</span></button>
    <button data-pt="journal"><i class="ico" style="--i:url(/commun/icones/journal.svg)"></i><span>Journal</span></button>
    <button data-pt="groupe"><i class="ico" style="--i:url(/commun/icones/groupe.svg)"></i><span>Groupe</span></button>
  </nav>
  <div id="pbody"></div>
</aside>
<div id="result" class="hidden"></div>
<div id="pick" class="hidden"></div>
<div id="modal" class="hidden"><div class="modal-box"></div></div>
<div id="toasts"></div>
<div id="lbl" class="hidden"></div>
<script src="/commun/core.js"></script>
<script src="/commun/sorts.js"></script>
<script src="/commun/mapview.js"></script>
<script src="/commun/classes.js"></script>
<script src="/commun/niveaux.js"></script>
<script src="/joueurs/joueurs.js"></script>
</body>
</html>
